<main class="frame" id="main" tabindex="-1"><section class="intro"><div><h1 id="pageTitle"></h1><p>美国站 · USD · 示例运营日 2026-11-24　／　所有对象、观察与回执均为本地模拟</p></div><button data-act="reset">重置示例</button></section><div class="grid"><aside class="panel side" id="left"></aside><div id="content"></div></div><p class="foot" id="saveNote"></p></main>
<div id="announce" role="status" aria-live="polite"></div><dialog id="confirm"><h2>重新开始这次演练？</h2><p>将清空本机保存的草案、观察、模拟回执和复盘记录，恢复示例起点。</p><div class="actions"><button class="btn" data-act="cancelReset">保留当前进度</button><button class="btn primary" data-act="doReset">重置示例</button></div></dialog>
<script>
'use strict';
const el=id=>document.getElementById(id), content=el('content'), left=el('left');
const chip=(text,c='')=>'<span class="chip '+c+'">'+text+'</span>',btn=(text,action,primary=false,disabled=false)=>'<button class="btn '+(primary?'primary':'')+'" data-act="'+action+'"'+(disabled?' disabled':'')+'>'+text+'</button>';
const note=(text,warn=false)=>'<div class="note '+(warn?'warn':'')+'">'+text+'</div>', card=html=>'<section class="panel">'+html+'</section>';
const metric=(label,val,caption)=>'<div class="meter"><small>'+label+'</small><b>'+val+'</b><em>'+caption+'</em></div>';
const evidence=(a,b)=>'<div class="evidence"><div>'+a+'</div><div>'+b+'</div></div>';
const readyBid=()=>({id:'B-01',kind:'bid',title:'复核两条独立关键词竞价',rows:[
{object:'gym bottle · T-301',old:'$0.82',next:'$0.74',status:'未提交',attempts:0},
{object:'gym water bottle · T-302',old:'$0.78',next:'$0.70',status:'未提交',attempts:0}],why:'复核人检查近两期相同商品的点击成本上移、转化率稳定及广告前单位贡献。两条独立单元均采用小幅调低的假设方案。',status:'待复核',log:['运营范琳提交草案，等待示例复核人林舟。']});
const STORAGE_KEY='homa.ads.offline.review.v1';
function demoHistory(){return {id:'H-24',kind:'bid',title:'已执行样例 · 调低单个精准词竞价',rows:[{object:'trail flask · T-240',old:'$0.85',next:'$0.72',status:'成功',attempts:1,receipt:'SIM-H24-1 · 已确认'}],why:'成熟商品的精准词测试小步调价；预设回看单位点击成本和贡献，同时保护流量。',status:'已回执',log:['历史演练：范琳登记草案，林舟批准；11/10 获得本地模拟成功回执。']}}
function restore(){try{const value=JSON.parse(localStorage.getItem(STORAGE_KEY));if(value?.schema===1&&Array.isArray(value.state?.drafts)&&value.state.reviews&&Array.isArray(value.state.followups))return value.state}catch(_){}return initial()}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({schema:1,state:s}));el('saveNote').textContent='已在当前浏览器本地保存。刷新可继续演练，重置可恢复示例起点。'}catch(_){el('saveNote').textContent='当前浏览器未开放本地存储，进度仅保留在本页；关闭后会清除。'}}
function initial(){return {view:'reviews',filter:'全部',task:'broad',draftId:'B-01',stock:false,observe:'initial',drafts:[readyBid(),demoHistory()],seq:0,reviewId:'H-24',cycle:'day',reviews:{},followups:[],rvSeq:0}}
let s=restore();if(parent!==window||location.hash==='#reviews')s.view='reviews';const draft=k=>s.drafts.find(d=>d.kind===k), success=k=>draft(k)?.status==='已回执', selected=()=>s.drafts.find(d=>d.id===s.draftId);
const FILTERS=['全部','数据待补','可分析','待复核'];const grade={'数据待补':'wait','可分析':'ready','待复核':'review','已核对':'ok','观察中':'wait'};
function tasks(){const all=[{id:'missing',title:'确认库存与补货覆盖',caption:'TRAVEL-450 · SP 预算评估',status:s.stock?'已核对':'数据待补'},
{id:'broad',title:'判断 Broad 搜索词能否转入 Exact',caption:'TRAIL-750 · insulated trail bottle',status:success('negative')?'已核对':success('exact')?'观察中':'可分析'}];
for(const d of s.drafts.filter(x=>['待复核','部分失败'].includes(x.status)))all.push({id:d.id,title:d.title,caption:d.id+' · '+(d.status==='部分失败'?'查看失败回执':'范琳提交 · 林舟复核'),status:'待复核'});for(const t of s.followups.filter(t=>t.status==='待办理'))all.push({id:t.id,title:t.title,caption:t.caseId+' · '+t.owner,status:'待复核'});return all}
function showDraft(id){s.view='changes';s.draftId=id;draw();focusTitle()}
function focusTitle(){const title=content.querySelector('h2');if(title){title.tabIndex=-1;title.classList.add('focusTitle');title.focus({preventScroll:true})}}
function say(m){el('announce').textContent=m}
function draw(){persist();el('pageTitle').textContent=s.view==='queue'?'今日广告待办':s.view==='reviews'?'复盘中心':'变更草案与逐项回执';document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===s.view);b.setAttribute('aria-pressed',b.dataset.nav===s.view)});
if(s.view==='reviews'){reviewPage();return}if(s.view==='queue'){const list=tasks(), shown=list.filter(t=>s.filter==='全部'||t.status===s.filter);left.innerHTML='<h2>办理队列</h2><div class="filters">'+FILTERS.map(t=>'<button class="toggle '+(s.filter===t?'active':'')+'" aria-pressed="'+(s.filter===t)+'" data-filter="'+t+'">'+t+' '+(t==='全部'?list.length:list.filter(x=>x.status===t).length)+'</button>').join('')+'</div>'+shown.map(t=>'<button class="task '+(s.task===t.id?'active':'')+'" data-task="'+t.id+'">'+chip(t.status,grade[t.status])+'<strong>'+t.title+'</strong><small>'+t.caption+'</small></button>').join('');if(!shown.length)left.innerHTML+='<p class="empty">此分类中暂无待办。</p>';if(!shown.some(t=>t.id===s.task))s.task=shown[0]?.id||'';if(s.task==='missing')stockView();else if(s.task==='broad')broadView();else if(s.task){const follow=s.followups.find(t=>t.id===s.task);if(follow)followPage(follow);else{s.draftId=s.task;draftView()}}else content.innerHTML=card('<h2>已清空此分类</h2><p class="muted">可切换到全部待办或查看变更回执。</p>')}
else {left.innerHTML='<h2>变更单</h2><p class="path">按最近生成排序</p>'+[...s.drafts].reverse().map(d=>'<button class="task '+(s.draftId===d.id?'active':'')+'" data-draft="'+d.id+'">'+chip(d.status,d.status==='已回执'?'ok':d.status==='部分失败'?'bad':'review')+'<strong>'+d.title+'</strong><small>'+d.id+' · '+d.rows.length+' 个变更对象</small></button>').join('');draftView()}}
function stockView(){content.innerHTML=card('<div class="rowhead"><h2>确认库存与补货覆盖</h2>'+chip(s.stock?'已核对':'数据待补',s.stock?'ok':'wait')+'</div><p class="path">US-DEMO · TRAVEL-450 · 广告活动 C-110</p><p>活动预算较早用完。申请增加预算前，先核对可售库存及补货到仓时间。</p><div class="meters">'+metric('日均销量','6 件','示例近 14 天')+metric('当前可售',s.stock?'48 件':'待补','US 本地仓')+metric('库存覆盖',s.stock?'8 天':'待计算','可售量 ÷ 日均销量')+metric('预计补货',s.stock?'15 天':'待补','预计到仓时间')+'</div>'+ (s.stock?note('示例快照 INV-08 显示覆盖 8 天，补货与缓冲共需 15＋3＝18 天。当前不建议增加预算。',true):note('缺少库存快照，检查结果为未知。先补齐来源与业务日期，预算动作暂缓。',true))+'<div class="actions">'+(s.stock?btn('查看 Broad 搜索词','backBroad',true):btn('载入示例库存快照','loadStock',true))+'</div>')}
function broadView(){
const ex=draft('exact'),neg=draft('negative'),m=s.observe==='good',weak=s.observe==='weak',approved=success('exact'),complete=success('negative');
const source=card('<div class="rowhead"><h2>insulated trail bottle</h2>'+chip('SP · Broad 来源','ready')+'</div><p class="path">US-DEMO / ASIN-DEMO-750 / 探索活动 C-101 / 广告组 G-11 / 广泛关键词 outdoor bottle</p><p>这条实际搜索词有成交，点击成本高于当前转化率下的盈亏平衡值。可在已有精准承接组 G-31 建一个 Exact 做独立观察。</p><div class="meters">'+metric('平均 CPC','$0.75','前期 $0.55')+metric('CVR','5.26%','前期 5.00%')+metric('ACOS','41.91%','目标 25%')+metric('广告后贡献','−$17','4 × $10 − $57')+'</div>'+evidence('<b>利润依据 · ECON-14</b>售价 $34，扣除成本与其他变动费用后，每件广告前贡献 $10。盈亏平衡 ACOS 为 29.41%，当前样本的平衡 CPC 约 $0.53。','<b>库存依据 · INV-17</b>可售 160 件，日均 8 件，覆盖 20 天。预计 12 天到仓，另留 4 天缓冲。')+'<details><summary>核对报告行、粒度及归因窗</summary><div class="scroll"><table><tr><th>SP 搜索词报告</th><th>点击</th><th>订单</th><th>花费</th><th>归因销售</th></tr><tr><td>10/20–11/02 · ST-14</td><td>80</td><td>4</td><td>$44</td><td>$136</td></tr><tr><td>11/03–11/16 · ST-27</td><td>76</td><td>4</td><td>$57</td><td>$136</td></tr></table></div><p class="smallNote">示例设定两期同广告账号、USD、同组同词，均为点击后 7 天的成熟归因，每单 1 件。目标 ACOS 是该成熟商品的内部示例配置。未使用广告位交叉数据。</p></details>');
const phase='<div class="stage"><span class="'+(!approved?'now':'')+'">创建 Exact</span><span>→</span><span class="'+(approved&&!neg?'now':'')+'">观察承接</span><span>→</span><span class="'+(neg?'now':'')+'">复核源组精准否定</span></div>';
let observation='';
if(approved){const v=m?['1,200','32','3','$14.40','9.38%','14.12%','+$15.60']:weak?['320','12','0','$5.40','0%','无分母','−$5.40']:['—','—','—','—','—','—','—'];
observation='<div class="cardline"><h3>Exact 承接组 G-31</h3><p class="path">同店铺、站点、ASIN、搜索词和归因口径 · 点击后 7 天</p><div class="scroll"><table><tr>'+['曝光','点击','订单','花费','CVR','ACOS','广告后贡献'].map(k=>'<th>'+k+'</th>').join('')+'</tr><tr>'+v.map(k=>'<td>'+k+'</td>').join('')+'</tr></table></div>'+ (m?note('成熟样本 EX-31：11/25–12/08 的观察在 12/16 已过归因窗，实际承接 32 次点击、3 单且有正贡献。可提源组精准否定，交由复核人决定。'):weak?note('成熟样本 EX-32：只有 12 次点击，且没有订单。继续保留 Broad 流量，无法提源组否定。',true):note('新建 Exact 的模拟回执已成功，承接组还没有成熟数据。以下按钮分别加载两个独立的假设结果。',true))+(neg?'':'<div class="actions">'+btn('演练成熟样本 · 承接不足','weak')+btn('演练成熟样本 · 承接充分','good')+'</div>')+'</div>'}
let actions=!ex?btn('生成 Exact 观察草案','createExact',true):!approved?btn('查看 Exact 草案','openExact',true):''; if(!neg)actions+=btn('提议源组精准否定','createNeg',m,m!==true);else actions+=btn(complete?'查看精准否定回执':'复核精准否定草案','openNeg',true);

 const eligible=s.drafts.filter(x=>x.rows.some(row=>row.attempts>0)||x.id===d.id);
 left.innerHTML='<h2>复盘分工</h2><div class="filters review-cycles">'+Object.entries(periodInfo).map(([k,p])=>'<button class="toggle '+(k===cycle?'active':'')+'" aria-pressed="'+(k===cycle)+'" data-cycle="'+k+'">'+p[0]+'</button>').join('')+'</div><p class="path">选择一笔变更</p>'+eligible.slice().reverse().map(x=>'<button class="task '+(x.id===d.id?'active':'')+'" data-review="'+x.id+'">'+chip(x.status,x.status==='已回执'?'ok':'wait')+'<strong>'+x.title+'</strong><small>'+x.id+' · '+(s.reviews[x.id]?.closed?'已有结论':'待办理')+'</small></button>').join('');
 content.innerHTML=card('<div class="rowhead"><h2>'+d.title+'</h2>'+chip('复盘第 '+r.rev+' 版','review')+'</div><p class="path">'+r.id+'　／　变更单 '+d.id+'</p><p><b>'+v[0]+' · '+v[1]+'</b>　'+v[2]+'</p>')+(cycle==='day'?daily(d,r):cycle==='week'?weekly(d,r):calendarMonth(d,r));
 persist()
}
function taskOpen(id){
 const t=s.followups.find(item=>item.id===id);if(!t)return;s.view='queue';s.filter='全部';s.task=t.id;
 if(t.status!=='待办理'){openReview(t.change,'week');const record=document.querySelector('[data-versions]');if(record)record.open=true;return}draw();focusTitle()
}
function followPage(t){content.innerHTML=card('<h2>'+t.title+'</h2><p class="path">'+t.id+' · 来源 '+t.caseId+' / 第 '+t.rev+' 版</p><p>经办人：'+t.owner+'。办理期限：'+t.due+'。</p>'+note('在原复盘中检查执行、观察与风险；完成这里只登记本地任务处理，平台设置保持原值。')+'<div class="actions"><button class="btn primary" data-taskdone="'+t.id+'">登记已办理</button><button class="btn" data-backreview="'+t.change+'">查看来源复盘</button></div>')}
function onReviewAction(action){
 const d=reviewChange(),r=reviewFor(d),key=reasonFor(d,r);
 if(action==='match'||action==='mismatch'){makeRecon(d,r,action==='match');return}
 if(action==='original'){showDraft(d.id);return}
 if(action==='toweek'||action==='tomonth'||action==='today'){openReview(d.id,{toweek:'week',tomonth:'month',today:'day'}[action]);return}
 if(action==='close'&&key&&!r.closed&&el('rvSign')?.checked){
  const [label,follow,owner,due]=decisions[key],id='F-'+(++s.rvSeq),calibratable=['clean','weak'].includes(key);
  r.closed={key,label,follow,rev:r.rev,task:id,calibratable,sample:r.sample};
  s.followups.push({id,caseId:r.id,change:d.id,rev:r.rev,title:follow,owner,due,status:'待办理'});
  audit(r,'复核人林舟','签署「'+label+'」，创建 '+id+' 并指派 '+owner+'。');draw();say('结论已保存并生成下一张任务。');return
 }
 if(action==='candidate'&&r.closed?.calibratable&&(!r.candidate||r.candidate.rev!==r.rev)){
  r.candidate={id:'CAL-'+(++s.rvSeq),rev:r.rev,status:'待独立离线验证'};
  audit(r,'策略负责人韩宁','登记 '+r.candidate.id+'，关联当前版本并保留 AD-BASE v1。');draw();return
 }
 if(action==='reopen'&&r.closed){
  const previous={...r.closed,readback:r.recon?.rows.map(v=>({...v}))||[]};r.history.push(previous);if(r.candidate?.rev===r.rev)r.candidate.status='已撤回';
  const t=s.followups.find(x=>x.id===previous.task);if(t&&t.status==='待办理')t.status='待复核旧版';
  audit(r,'复核人林舟','因证据修订重开；保留已签结论「'+previous.label+'」与历史任务。旧版候选须重新验证。');
  r.rev++;r.recon=null;r.sample=null;r.closed=null;s.cycle='day';audit(r,'运营范琳','开始新版对账，等待新的独立读回。');draw();return
 }
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.cycle){openReview(s.reviewId,b.dataset.cycle);return}if(b.dataset.review){openReview(b.dataset.review,s.cycle);return}
 if(b.dataset.follow){taskOpen(b.dataset.follow);return}if(b.dataset.backreview){openReview(b.dataset.backreview,'week');return}
 if(b.dataset.taskdone){const t=s.followups.find(x=>x.id===b.dataset.taskdone);if(t&&t.status==='待办理'){t.status='已办理';const d=s.drafts.find(x=>x.id===t.change);audit(reviewFor(d),t.owner,'登记关联任务 '+t.id+' 已办理。');openReview(t.change,'week')}return}
 if(b.dataset.act?.startsWith('rv-'))onReviewAction(b.dataset.act.slice(3))
});
document.addEventListener('change',e=>{
 if(s.view!=='reviews')return;
 if(e.target.id==='rvSign'){const button=document.querySelector('[data-act=rv-close]');if(button)button.disabled=!e.target.checked;return}
 if(e.target.id==='rvSample'){const d=reviewChange(),r=reviewFor(d),k=e.target.value;if(!r.closed&&sameRecon(d,r)&&r.recon.matched&&samples[k]&&r.sample!==k){r.sample=k;audit(r,'复核人林舟','加载假设观察 '+samples[k].id+'「'+samples[k].title+'」。');draw()}}
});

draw();
</script></body></html>
